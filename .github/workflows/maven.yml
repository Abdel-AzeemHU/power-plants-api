name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: Abdel-AzeemHU/us-power-plants-js
          path: us-power-plants

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'

      - name: Install dependencies
        working-directory: ./us-power-plants
        run: yarn install

      - name: Start API in background
        working-directory: ./us-power-plants
        run: nohup make api-start > api.log 2>&1 &

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/health; then
              echo "API is up!"
              break
            fi
            sleep 2
          done

      # Add your tests or additional steps below
      - name: Run tests
        working-directory: ./us-power-plants
        run: echo "Test logic here"
