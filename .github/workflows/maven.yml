name: API Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  API_PORT: 9000

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout API project first
      - name: Checkout API code
        uses: actions/checkout@v4
        with:
          repository: Abdel-AzeemHU/us-power-plants-js
          path: us-power-plants
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Node.js with caching AFTER checkout
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: 'us-power-plants/yarn.lock'

      # 3. Checkout Test project
      - name: Checkout Test code
        uses: actions/checkout@v4
        with:
          path: power-plants-api

      # 4. Install API dependencies
      - name: Install API dependencies
        working-directory: ./us-power-plants
        run: |
          npm install -g yarn@1.22.22
          yarn install --frozen-lockfile
          yarn add nodemon ts-node --dev

      # 5. Start API
      - name: Start API
        working-directory: ./us-power-plants
        run: |
          nohup yarn nodemon app.ts > api.log 2>&1 &
          echo $! > api.pid
          
          echo "Waiting for API startup..."
          for i in {1..30}; do
            if curl -f http://localhost:${{ env.API_PORT }}/api-docs && 
               grep -q "UP and running on 0.0.0.0:${{ env.API_PORT }}" api.log; then
              echo "API ready!"
              break
            fi
            sleep 2
            echo "Waiting... ($i/30)"
          done
          
          if ! curl -f http://localhost:${{ env.API_PORT }}/api-docs; then
            echo "API failed to start. Logs:"
            cat api.log
            exit 1
          fi

      # 6. Setup Java for tests
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 7. Run API tests
      - name: Run tests
        working-directory: ./power-plants-api
        run: |
          mvn test -Dapi.base.url=http://localhost:${{ env.API_PORT }}

      # 8. Cleanup
      - name: Stop API
        if: always()
        working-directory: ./us-power-plants
        run: |
          if [ -f api.pid ]; then
            kill -9 $(cat api.pid) || true
            rm api.pid
          fi
          pkill -f "[n]odemon app.ts" || true