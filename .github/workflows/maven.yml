name: API Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  API_PORT: 9000

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout API project
      - name: Checkout API code
        uses: actions/checkout@v4
        with:
          repository: Abdel-AzeemHU/us-power-plants-js
          path: api-project
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Node.js for API
      - name: Setup Node for API
        uses: actions/setup-node@v4
        with:
          node-version: 18
          working-directory: ./api-project

      # 3. Install API dependencies
      - name: Install API dependencies
        working-directory: ./api-project
        run: |
          npm install -g yarn
          yarn install --frozen-lockfile

      # 4. Start the API
      - name: Start API
        working-directory: ./api-project/opt/api  # Adjust to your API directory
        run: |
          make api-start > api.log 2>&1 &
          echo $! > api.pid
          
          # Wait for API to be ready
          timeout=60
          while [ $timeout -gt 0 ]; do
            if curl -f http://localhost:${{ env.API_PORT }}/api-docs; then
              echo "API is ready!"
              break
            fi
            sleep 2
            timeout=$((timeout-2))
            echo "Waiting for API to start..."
          done
          
          if [ $timeout -le 0 ]; then
            echo "API failed to start"
            cat api.log
            exit 1
          fi

      # 5. Checkout Test project
      - name: Checkout Test code
        uses: actions/checkout@v4
        with:
          path: test-project

      # 6. Setup Test environment (Java/Maven if needed)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 7. Run your API tests
      - name: Run tests
        working-directory: ./test-project
        run: |
          # Example: mvn test
          # Or your actual test command
          echo "Running tests against http://localhost:${{ env.API_PORT }}"
          mvn test -Dapi.base.url=http://localhost:${{ env.API_PORT }}

      # 8. Cleanup (always runs)
      - name: Stop API
        if: always()
        working-directory: ./api-project/opt/api  # Same as Start API step
        run: |
          if [ -f api.pid ]; then
            kill -9 $(cat api.pid) || true
            rm api.pid
          fi