name: API Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  API_PORT: 9000

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout API code
        uses: actions/checkout@v4
        with:
          repository: Abdel-AzeemHU/us-power-plants-js
          path: us-power-plants

      - name: Checkout test code
        uses: actions/checkout@v4
        with:
          path: power-plants-api

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install API dependencies
        working-directory: ./us-power-plants
        run: yarn install --frozen-lockfile

      - name: Start API using make
        working-directory: ./us-power-plants
        run: |
          make api-start > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for API to be ready
        run: |
          for i in {1..15}; do
            if curl -s -f http://localhost:${{ env.API_PORT }}/api-docs/ > /dev/null; then
              echo "API is up!"
              exit 0
            fi
            echo "Waiting for API to start... ($i/15)"
            sleep 2
          done
          echo "API did not start in time, printing logs:"
          cat ./us-power-plants/api.log
          exit 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run API tests
        working-directory: ./power-plants-api
        run: mvn test -Dapi.base.url=http://localhost:${{ env.API_PORT }}

      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-logs
          path: ./us-power-plants/api.log

      - name: Stop API
        if: always()
        working-directory: ./us-power-plants
        run: |
          if [ -f api.pid ]; then
            kill -9 $(cat api.pid) || true
            rm api.pid
          fi
          pkill -f "[n]odemon" || true
