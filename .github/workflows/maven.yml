name: API Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  API_PORT: 9000

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout API project (us-power-plants-js)
      - name: Checkout API code
        uses: actions/checkout@v4
        with:
          repository: Abdel-AzeemHU/us-power-plants-js
          path: us-power-plants-js
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Checkout Test project (power-plants-api)
      - name: Checkout Test code
        uses: actions/checkout@v4
        with:
          path: power-plants-api

      # 3. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 4. Install API dependencies
      - name: Install API dependencies
        working-directory: ./us-power-plants-js
        run: |
          npm install -g yarn
          yarn install --frozen-lockfile

      # 5. Start the API (from root of us-power-plants-js)
      - name: Start API
        working-directory: ./us-power-plants-js
        run: |
          make api-start > api.log 2>&1 &
          echo $! > api.pid
          
          # Wait for API to be ready
          timeout=60
          while [ $timeout -gt 0 ]; do
            if curl -f http://localhost:${{ env.API_PORT }}/api-docs; then
              echo "API is ready!"
              break
            fi
            sleep 2
            timeout=$((timeout-2))
            echo "Waiting for API to start..."
          done
          
          if [ $timeout -le 0 ]; then
            echo "API failed to start"
            cat api.log
            exit 1
          fi

      # 6. Setup Java for tests (if needed)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 7. Run API tests
      - name: Run tests
        working-directory: ./power-plants-api
        run: |
          # Example test command - replace with your actual command
          mvn test -Dapi.base.url=http://localhost:${{ env.API_PORT }}

      # 8. Cleanup (always runs)
      - name: Stop API
        if: always()
        working-directory: ./us-power-plants-js
        run: |
          if [ -f api.pid ]; then
            kill -9 $(cat api.pid) || true
            rm api.pid
          fi