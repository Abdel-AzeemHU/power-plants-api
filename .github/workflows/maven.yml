name: API Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  API_PORT: 9000

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          npm install -g yarn
          yarn install --frozen-lockfile

      # 4. Start the API
      - name: Start API
        run: |
          make api-start > api.log 2>&1 &
          echo $! > api.pid
          
          # Wait for API to be ready
          timeout=60
          while [ $timeout -gt 0 ]; do
            if curl -f http://localhost:${{ env.API_PORT }}/api-docs; then
              echo "API is ready!"
              break
            fi
            sleep 2
            timeout=$((timeout-2))
            echo "Waiting for API to start..."
          done
          
          if [ $timeout -le 0 ]; then
            echo "API failed to start"
            cat api.log
            exit 1
          fi

      # 5. Run your API tests (adjust this command as needed)
      - name: Run tests
        run: |
          # Example test command - replace with your actual test command
          yarn test

      # 6. Cleanup (always runs)
      - name: Stop API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill -9 $(cat api.pid) || true
            rm api.pid
          fi