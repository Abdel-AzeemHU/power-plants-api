name: API Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  API_PORT: 9000

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout API project
      - name: Checkout API code
        uses: actions/checkout@v4
        with:
          repository: Abdel-AzeemHU/us-power-plants-js
          path: us-power-plants
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Checkout Test project
      - name: Checkout Test code
        uses: actions/checkout@v4
        with:
          path: power-plants-api

      # 3. Setup Node.js (exact match for local)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Match your local version
          cache: 'yarn'

      # 4. Install exact dependencies (like local)
      - name: Install dependencies
        working-directory: ./us-power-plants
        run: |
          npm install -g yarn@1.22.22  # Your exact yarn version
          yarn install --frozen-lockfile
          yarn add nodemon ts-node --dev  # Ensure these are present

      # 5. Start API exactly like local
      - name: Start API
        working-directory: ./us-power-plants
        run: |
          # Start API with same command as local
          nohup yarn nodemon app.ts > api.log 2>&1 &
          echo $! > api.pid
          
          # Health check with exact same output
          echo "Waiting for API to start (like local environment)..."
          timeout=60
          while [ $timeout -gt 0 ]; do
            if curl -f http://localhost:${{ env.API_PORT }}/api-docs && 
               grep -q "UP and running on 0.0.0.0:${{ env.API_PORT }}" api.log; then
              echo "{ message: 'server running on 0.0.0.0:${{ env.API_PORT }}', level: 'info' }"
              echo "UP and running on 0.0.0.0:${{ env.API_PORT }}."
              break
            fi
            sleep 2
            timeout=$((timeout-2))
          done
          
          if [ $timeout -le 0 ]; then
            echo "API failed to start (checking logs)..."
            cat api.log
            exit 1
          fi

      # 6. Run tests from test repo
      - name: Run API tests
        working-directory: ./power-plants-api
        run: |
          # Replace with your actual test command
          mvn test -Dapi.base.url=http://localhost:${{ env.API_PORT }}

      # 7. Cleanup (matches local process stop)
      - name: Stop API
        if: always()
        working-directory: ./us-power-plants
        run: |
          if [ -f api.pid ]; then
            kill -9 $(cat api.pid) || true
            rm api.pid
          fi
          # Also kill any nodemon processes
          pkill -f "nodemon app.ts" || true