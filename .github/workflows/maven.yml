name: API Automation Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger

env:
  ALLURE_RESULTS_DIR: 'allure-results'
  ALLURE_REPORT_DIR: 'allure-report'
  TEST_SUITE: 'Power Plants API Regression Test Suite'
  ENVIRONMENT: 'Testing'
  TESTER: 'Abdelazeem Hussein'
  NODE_VERSION: '18'
  JAVA_VERSION: '17'
  API_PORT: '9000'

jobs:
  api-automation-tests:
    runs-on: ubuntu-latest

    services:
      # Start a PostgreSQL container for testing
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: powerplants
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Yarn
        run: |
          npm install -g yarn
          yarn --version

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Dependencies
        run: |
          yarn install --frozen-lockfile
          # Ensure ts-node and nodemon are available
          yarn add ts-node nodemon --dev

      - name: Setup Java (for API tests)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Start Power Plants API
        run: |
          # Set up environment variables
          echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/powerplants" >> .env
          echo "PORT=${{ env.API_PORT }}" >> .env
          echo "NODE_ENV=test" >> .env

          # Start the API in background
          nohup yarn dev > api.log 2>&1 &
          echo $! > api.pid

          # Wait for API to start
          echo "Waiting for API to start on port ${{ env.API_PORT }}..."
          timeout=60
          while [ $timeout -gt 0 ]; do
            if curl -f http://localhost:${{ env.API_PORT }}/api-docs 2>/dev/null; then
              echo "API is ready!"
              break
            fi
            echo "Waiting for API to start..."
            sleep 2
            timeout=$((timeout-2))
          done

          if [ $timeout -le 0 ]; then
            echo "API failed to start within timeout"
            echo "API logs:"
            cat api.log
            echo "Process list:"
            ps aux
            exit 1
          fi

      - name: Run Database Migrations
        run: |
          yarn db:migrate

      - name: Checkout API Tests (if in separate repo)
        if: false # Set to true if tests are in separate repo
        uses: actions/checkout@v4
        with:
          repository: your-org/api-tests-repo
          path: api-tests
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Run API Tests
        working-directory: ./ # Change to api-tests if using separate repo
        run: |
          # Build test project (if Maven)
          mvn clean install -DskipTests

          # Run API tests
          mvn test -Dsurefire.suiteXmlFiles=testng.xml \
            -Dallure.results.directory=${{ env.ALLURE_RESULTS_DIR }} \
            -Dapi.base.url=http://localhost:${{ env.API_PORT }}

          # Generate test summary
          mkdir -p reports
          echo "Test Suite: ${{ env.TEST_SUITE }}" > reports/summary.txt
          echo "Environment: ${{ env.ENVIRONMENT }}" >> reports/summary.txt
          echo "Tester: ${{ env.TESTER }}" >> reports/summary.txt
          echo "API Base URL: http://localhost:${{ env.API_PORT }}" >> reports/summary.txt

      - name: Generate Allure Report
        if: always()
        run: |
          # Setup Allure
          curl -Lo allure-2.30.0.tgz https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
          tar -zxvf allure-2.30.0.tgz
          sudo mv allure-2.30.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure
          
          # Generate report
          allure generate ${{ env.ALLURE_RESULTS_DIR }} -o ${{ env.ALLURE_REPORT_DIR }} --clean

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: ${{ env.ALLURE_REPORT_DIR }}
          retention-days: 30

      - name: Stop Power Plants API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill -9 $(cat api.pid) || true
            rm api.pid
          fi
          pkill -f "node.*app\.ts" || true

      - name: Comment Test Results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = 'Test summary not available';
            try {
              summary = fs.readFileSync('reports/summary.txt', 'utf8');
            } catch (e) {}
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## API Test Results\n\n${summary}\n\n[View Workflow Run](${github.server_url}/${github.repository}/actions/runs/${github.run_id})`
            });