name: API Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  API_PORT: 9000

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the Test project (power-plants-api)
      # This is the repository where this workflow file resides.
      # By default, it will be checked out to the root of the runner's workspace.
      - name: Checkout Test code (main repo)
        uses: actions/checkout@v4

      # 2. Checkout the API project (us-power-plants-js)
      # This repository contains the Node.js API code and is checked out
      # into a specific subdirectory named 'us-power-plants'.
      - name: Checkout API code
        uses: actions/checkout@v4
        with:
          repository: Abdel-AzeemHU/us-power-plants-js
          path: us-power-plants # Checks out into a directory named 'us-power-plants'
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Setup Node.js (without built-in caching, as we'll use actions/cache explicitly)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 4. Cache Node.js modules
      # This step explicitly caches the 'node_modules' directory for the API project.
      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: us-power-plants/node_modules # Path to the node_modules directory
          key: ${{ runner.os }}-yarn-${{ hashFiles('us-power-plants/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # 5. Install API dependencies
      # This step will now install dependencies. If a cache hit occurred in the previous step,
      # yarn install will be very fast as modules are already present.
      - name: Install API dependencies
        working-directory: ./us-power-plants
        run: |
          npm install -g yarn@1.22.22 # Ensure yarn is available
          yarn install --frozen-lockfile

      # 6. Install nodemon and ts-node (dev dependencies)
      # Moved these to a separate step to ensure they are installed after core dependencies
      # and potentially after cache restoration.
      - name: Install Dev Dependencies (nodemon, ts-node)
        working-directory: ./us-power-plants
        run: |
          yarn add nodemon ts-node --dev

      # 7. Start the API in the background
      # This step starts the Node.js API and waits for it to be ready.
      - name: Start API
        working-directory: ./us-power-plants
        run: |
          # Start nodemon in the background, redirecting output to api.log
          nohup yarn nodemon app.ts > api.log 2>&1 &
          # Store the process ID for later cleanup
          echo $! > api.pid
          
          echo "Waiting for API startup..."
          # Loop to check if the API is up and running
          for i in {1..30}; do
            # Check if the API docs endpoint is reachable and if the log indicates it's running
            if curl -f http://localhost:${{ env.API_PORT }}/api-docs && \
               grep -q "UP and running on 0.0.0.0:${{ env.API_PORT }}" api.log; then
              echo "API ready!"
              break
            fi
            sleep 2
            echo "Waiting... ($i/30)"
          done
          
          # Final check: if API is not up, print logs and exit with error
          if ! curl -f http://localhost:${{ env.API_PORT }}/api-docs; then
            echo "API failed to start. Logs:"
            cat api.log
            exit 1
          fi

      # 8. Setup Java for tests
      # This is required for running your Maven-based API tests.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 9. Run API tests
      # Navigate to the root of the test project (where the workflow is).
      - name: Run tests
        working-directory: . # The test project is now at the root of the workspace
        run: |
          mvn test -Dapi.base.url=http://localhost:${{ env.API_PORT }}

      # 10. Cleanup: Stop the API process
      # This step ensures the API process is terminated, even if tests fail.
      - name: Stop API
        if: always() # Always run this step
        working-directory: ./us-power-plants
        run: |
          if [ -f api.pid ]; then
            kill -9 $(cat api.pid) || true # Kill by PID if file exists
            rm api.pid
          fi
          # Fallback to kill any remaining nodemon processes
          pkill -f "[n]odemon app.ts" || true
